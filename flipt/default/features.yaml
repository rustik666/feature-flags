version: "1.5"
namespace:
    key: default
    name: Default
flags:
    - key: test-boolean
      name: Test Boolean
      type: BOOLEAN_FLAG_TYPE
      enabled: false
segments:
    - key: test-segment
      name: Test Segment
      constraints:
        - type: STRING_COMPARISON_TYPE
          property: id
          operator: eq
          value: test
      match_type: ALL_MATCH_TYPE
